name: Build and release Windows binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows x64 packages
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Isolate application settings for CI
        run: |
          $settings = Join-Path $env:RUNNER_TEMP 'clipfeed-ci/settings.json'
          "CLIPFEED_SETTINGS_PATH=$settings" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install FFmpeg and ffprobe
        id: ffmpeg
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $checksumPath = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip.sha256'
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest -Uri $url -OutFile $archive
          Invoke-WebRequest -Uri "$url.sha256" -OutFile $checksumPath
          $expected = ((Get-Content -LiteralPath $checksumPath -Raw).Trim() -split '\s+')[0]
          if ($expected -notmatch '^[a-fA-F0-9]{64}$' -or
              (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'FFmpeg download failed SHA-256 verification.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $tools = @(Get-ChildItem -LiteralPath $destination -Filter ffmpeg.exe -Recurse)
          if ($tools.Count -ne 1) { throw 'Expected exactly one ffmpeg.exe.' }
          $bin = $tools[0].Directory.FullName
          if (!(Test-Path -LiteralPath (Join-Path $bin 'ffprobe.exe'))) {
            throw 'FFprobe is missing from the FFmpeg download.'
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "bin=$bin" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build portable applications and smoke-test binaries
        env:
          FFMPEG_BIN: ${{ steps.ffmpeg.outputs.bin }}
        run: |
          $node = (Get-Command node.exe).Source
          python build.py --ffmpeg-dir $env:FFMPEG_BIN --js-runtime $node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run launcher and packaging tests
        run: |
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run backend tests
        run: |
          .\.venv\Scripts\python.exe -m unittest discover -s backend/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run frontend browser tests
        run: |
          foreach ($suite in @('test:player', 'test:app', 'test:webm')) {
            npm.cmd --prefix frontend run $suite
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package binaries and generate timestamp version
        id: package
        run: |
          # UTC: YYYY.MM.DDHHmm. The version is also the release tag, without a prefix.
          $version = [DateTime]::UtcNow.ToString('yyyy.MM.ddHHmm')
          $destination = Join-Path $env:GITHUB_WORKSPACE 'build/release-assets'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          foreach ($profile in @('Debug', 'Release')) {
            $source = Join-Path $env:GITHUB_WORKSPACE "dist/$profile"
            $archive = Join-Path $destination "ClipFeed-$version-windows-x64-$profile.zip"
            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              $source, $archive, [System.IO.Compression.CompressionLevel]::Optimal, $true
            )
          }
          $checksums = Get-ChildItem -LiteralPath $destination -Filter '*.zip' |
            Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $checksums | Set-Content -LiteralPath (Join-Path $destination 'SHA256SUMS.txt') -Encoding ascii
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "Built Windows x64 packages: **$version** (UTC)." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-${{ steps.package.outputs.version }}
          path: build/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          name: windows-x64-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Create timestamped release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cat > release-notes.md <<'EOF'
          Portable Windows x64 packages. Extract the chosen ZIP and run `run.bat` inside its folder.

          - **Debug:** local access on `127.0.0.1`.
          - **Release:** LAN access on `0.0.0.0`.

          Keep the entire extracted folder: the executable uses the included frontend, FFmpeg, ffprobe, Node.js, and configuration files. Whisper model weights download on first use.

          `SHA256SUMS.txt` contains checksums for both ZIPs. The release version uses UTC in `YYYY.MM.DDHHmm` format.
          EOF
          gh release create "$RELEASE_VERSION" release-assets/* \
            --repo "$GH_REPO" \
            --target "$RELEASE_COMMIT" \
            --title "$RELEASE_VERSION" \
            --notes-file release-notes.md \
            --generate-notes
